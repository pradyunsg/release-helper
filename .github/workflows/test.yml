name: Tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests / ${{ matrix.python }}
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: true
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
    - uses: actions/checkout@v2
      with:
        persist-credentials: false
    - uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python }}
    - run: "git config --global user.name \"GitHub Actions\"\ngit config --global user.email \"41898282+github-actions[bot]@users.noreply.github.com\""
    - run: git config --global init.defaultBranch main
    - run: pipx install nox
    - run: nox -s test --force-python ${{ matrix.python }}
    timeout-minutes: 30
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
