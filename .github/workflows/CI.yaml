name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests / ${{ matrix.python }}
    timeout-minutes: 30
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: true
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ matrix.python }}
    - run: "git config --global user.name \"GitHub Actions\"\ngit config --global user.email \"41898282+github-actions[bot]@users.noreply.github.com\""
    - run: git config --global init.defaultBranch main
    - run: pipx install nox
    - run: nox -s test --force-python ${{ matrix.python }}

  configuration:
    name: Pre-commit checks
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.14'
    - run: pipx run prek run --all-files
